
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Date</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* Four videos covering the entire screen */
        .video-background {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .video-frame {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .video-frame video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Invitation image and button */
        .invitation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(76vw, 460px);
            max-height: 85vh;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .invitation img {
            width: 100%;
            height: auto;
            max-height: 85vh;
            object-fit: contain;
            display: block;
        }

        /* Click Me button */
        .click-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 13px 35px;
            background: #ff69a6;
            color: white;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: 0.3s ease;
        }

        .click-button:hover {
            background: #e83e87;
            transform: translateX(-50%) scale(1.08);
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .invitation {
                width: 86vw;
            }

            .click-button {
                bottom: 15px;
                padding: 11px 28px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="video-background">

        <div class="video-frame">
            <video muted loop playsinline preload="metadata">
                <source src="images/mabala.mp4" type="video/mp4">
            </video>
        </div>

        <div class="video-frame">
            <video muted loop playsinline preload="metadata">
                <source src="images/mabala2.mp4" type="video/mp4">
            </video>
        </div>

        <div class="video-frame">
            <video muted loop playsinline preload="metadata">
                <source src="images/mabala3.mp4" type="video/mp4">
            </video>
        </div>

        <div class="video-frame">
            <video muted loop playsinline preload="metadata">
                <source src="images/mabala4.mp4" type="video/mp4">
            </video>
        </div>

    </div>

    <!-- Centre invitation -->
    <div class="invitation">

        <img src="images/PICNIC DATE.png" alt="Date invitation">

        <a href="Confirmation.html" class="click-button">
            CLICKME: SO WHAT DO YOU SAY?
        </a>

    </div>

    <script>
        const videos = document.querySelectorAll("video");

        videos.forEach(video => {

            video.parentElement.addEventListener("mouseenter", () => {
                video.play();
            });

            video.parentElement.addEventListener("mouseleave", () => {
                video.pause();
                video.currentTime = 0;
            });

            video.parentElement.addEventListener("click", () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

        });
    </script>

</body>
</html>
