
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vuyokazi Mabala</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    background: linear-gradient(135deg, #ffe4ee, #ffc1d8, #ffdae8);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
}

.container {
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
    text-align: center;
}

.small-text {
    color: #a64d70;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 25px;
}

/* HEART FRAME */

.heart-container {
    position: relative;
    width: min(90vw, 430px);
    aspect-ratio: 1 / 0.95;
    margin-bottom: 25px;
}

.heart {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    transform: rotate(-2deg);
}

/* PHOTO SLOTS */

.photo {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border: 3px solid white;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(160, 50, 95, 0.18);
    background: #f8b2ca;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* HEART SHAPE POSITIONS */

.p1  { grid-area: 1 / 2; }
.p2  { grid-area: 1 / 3; }
.p3  { grid-area: 1 / 5; }
.p4  { grid-area: 1 / 6; }

.p5  { grid-area: 2 / 1; }
.p6  { grid-area: 2 / 2; }
.p7  { grid-area: 2 / 3; }
.p8  { grid-area: 2 / 5; }
.p9  { grid-area: 2 / 6; }
.p10 { grid-area: 2 / 7; }

.p11 { grid-area: 3 / 1; }
.p12 { grid-area: 3 / 2; }
.p13 { grid-area: 3 / 6; }
.p14 { grid-area: 3 / 7; }

.p15 { grid-area: 4 / 2; }
.p16 { grid-area: 4 / 3; }
.p17 { grid-area: 4 / 5; }
.p18 { grid-area: 4 / 6; }

.p19 { grid-area: 5 / 3; }
.p20 { grid-area: 5 / 4; }
.p21 { grid-area: 5 / 5; }

.p22 { grid-area: 6 / 4; }

/* NAME IN THE MIDDLE */

.name {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 68%;
    z-index: 5;
    background: rgba(255, 225, 237, 0.94);
    border: 2px solid white;
    border-radius: 50%;
    padding: 17px 5px;
    box-shadow: 0 5px 20px rgba(160, 50, 95, 0.12);
}

.name h1 {
    color: #a83265;
    font-family: 'Great Vibes', cursive;
    font-size: clamp(35px, 9vw, 58px);
    font-weight: normal;
    line-height: 1.1;
}

/* BUTTON */

.ready-button {
    display: inline-block;
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #ed77a5, #d83d7b);
    padding: 14px 40px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    box-shadow: 0 7px 18px rgba(190, 55, 110, 0.25);
    transition: 0.3s;
}

.ready-button:hover {
    transform: scale(1.06);
}

.footer {
    color: #a64d70;
    font-size: 11px;
    margin-top: 18px;
}

/* MOBILE RESPONSIVENESS */

@media (max-width: 480px) {
    .heart-container {
        width: 94vw;
    }

    .heart {
        gap: 4px;
    }

    .photo {
        border-width: 2px;
        border-radius: 8px;
    }

    .name {
        width: 72%;
        padding: 13px 3px;
    }

    .name h1 {
        font-size: clamp(34px, 9vw, 45px);
    }
}
</style>
</head>

<body>
